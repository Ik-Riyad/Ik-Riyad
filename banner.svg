<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="420" viewBox="0 0 1280 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Riyadh banner">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#23103a"/>
      <stop offset="55%" stop-color="#0f0717"/>
      <stop offset="100%" stop-color="#3a0e14"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="420" fill="url(#bg)"/>
  <!-- Bigger transparent card -->
  <rect x="340" y="90" width="600" height="220" rx="25" ry="25"
        fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Logo text -->
  <g id="logo" transform="translate(640,200)">
    <text text-anchor="middle"
          dominant-baseline="central"
          font-family="Georgia, 'Times New Roman', serif"
          font-weight="700"
          font-size="88"
          fill="#ffffff"
          filter="url(#glow)"
          letter-spacing="0.5">
      Riyadh
    </text>
  </g>
  <!-- Snow particles -->
  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="110" cy="440" r="2.4">
      <animate attributeName="cy" from="440" to="-30" dur="8s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="220" cy="440" r="3.6">
      <animate attributeName="cy" from="440" to="-30" dur="12s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="320" cy="440" r="1.8">
      <animate attributeName="cy" from="440" to="-30" dur="6.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="430" cy="440" r="2.8">
      <animate attributeName="cy" from="440" to="-30" dur="10s" repeatCount="indefinite" begin="2.2s"/>
    </circle>
    <circle cx="540" cy="440" r="2.0">
      <animate attributeName="cy" from="440" to="-30" dur="7.5s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="650" cy="440" r="3.2">
      <animate attributeName="cy" from="440" to="-30" dur="9.5s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="760" cy="440" r="2.4">
      <animate attributeName="cy" from="440" to="-30" dur="11s" repeatCount="indefinite" begin="1.7s"/>
    </circle>
    <circle cx="870" cy="440" r="1.6">
      <animate attributeName="cy" from="440" to="-30" dur="6s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="980" cy="440" r="2.2">
      <animate attributeName="cy" from="440" to="-30" dur="8.2s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle cx="1100" cy="440" r="3.8">
      <animate attributeName="cy" from="440" to="-30" dur="13s" repeatCount="indefinite" begin="2.5s"/>
    </circle>
  </g>
</svg>
