<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="560" viewBox="0 0 1280 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Riyadh banner">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#23103a"/>
      <stop offset="55%" stop-color="#0f0717"/>
      <stop offset="100%" stop-color="#3a0e14"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="560" fill="url(#bg)"/>
  <!-- Bigger transparent card -->
  <rect x="340" y="160" width="600" height="220" rx="25" ry="25"
        fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Logo text -->
  <g id="logo" transform="translate(640,270)">
    <text text-anchor="middle"
          dominant-baseline="central"
          font-family="Georgia, 'Times New Roman', serif"
          font-weight="700"
          font-size="88"
          fill="#ffffff"
          filter="url(#glow)"
          letter-spacing="0.5">
      Riyadh
    </text>
  </g>
  <!-- Enhanced snow particles -->
  <g fill="#ffffff">
    <!-- Large snow particles -->
    <circle cx="85" cy="580" r="4.2" fill-opacity="0.9">
      <animate attributeName="cy" from="580" to="-40" dur="11s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;1;0.8;1;0" dur="11s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="185" cy="580" r="3.8" fill-opacity="0.85">
      <animate attributeName="cy" from="580" to="-40" dur="13s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.8;1;0.7;0" dur="13s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="285" cy="580" r="2.6" fill-opacity="0.75">
      <animate attributeName="cy" from="580" to="-40" dur="8.5s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0;0.7;1;0.6;0" dur="8.5s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="395" cy="580" r="3.4" fill-opacity="0.9">
      <animate attributeName="cy" from="580" to="-40" dur="12s" repeatCount="indefinite" begin="2.8s"/>
      <animate attributeName="opacity" values="0;0.9;1;0.8;0" dur="12s" repeatCount="indefinite" begin="2.8s"/>
    </circle>
    <circle cx="485" cy="580" r="2.2" fill-opacity="0.7">
      <animate attributeName="cy" from="580" to="-40" dur="9s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" values="0;0.6;1;0.7;0" dur="9s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="595" cy="580" r="4.6" fill-opacity="0.95">
      <animate attributeName="cy" from="580" to="-40" dur="14s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0;1;0.9;1;0" dur="14s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="705" cy="580" r="3.0" fill-opacity="0.8">
      <animate attributeName="cy" from="580" to="-40" dur="10.5s" repeatCount="indefinite" begin="2.1s"/>
      <animate attributeName="opacity" values="0;0.8;1;0.6;0" dur="10.5s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
    <circle cx="825" cy="580" r="2.8" fill-opacity="0.85">
      <animate attributeName="cy" from="580" to="-40" dur="7.5s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0;0.8;1;0.7;0" dur="7.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="935" cy="580" r="3.6" fill-opacity="0.9">
      <animate attributeName="cy" from="580" to="-40" dur="11.8s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="opacity" values="0;0.9;1;0.8;0" dur="11.8s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="1045" cy="580" r="4.0" fill-opacity="0.95">
      <animate attributeName="cy" from="580" to="-40" dur="15s" repeatCount="indefinite" begin="3.2s"/>
      <animate attributeName="opacity" values="0;1;0.9;1;0" dur="15s" repeatCount="indefinite" begin="3.2s"/>
    </circle>
    <circle cx="1155" cy="580" r="2.4" fill-opacity="0.75">
      <animate attributeName="cy" from="580" to="-40" dur="8s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="opacity" values="0;0.7;1;0.6;0" dur="8s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    
    <!-- Medium snow particles -->
    <circle cx="140" cy="580" r="2.0" fill-opacity="0.6">
      <animate attributeName="cy" from="580" to="-40" dur="9.2s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="opacity" values="0;0.6;0.8;0.5;0" dur="9.2s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
    <circle cx="340" cy="580" r="1.8" fill-opacity="0.55">
      <animate attributeName="cy" from="580" to="-40" dur="7.8s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0;0.5;0.7;0.4;0" dur="7.8s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="540" cy="580" r="1.6" fill-opacity="0.5">
      <animate attributeName="cy" from="580" to="-40" dur="6.5s" repeatCount="indefinite" begin="2.1s"/>
      <animate attributeName="opacity" values="0;0.4;0.6;0.3;0" dur="6.5s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
    <circle cx="740" cy="580" r="2.2" fill-opacity="0.65">
      <animate attributeName="cy" from="580" to="-40" dur="10.2s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0;0.6;0.8;0.5;0" dur="10.2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="940" cy="580" r="1.4" fill-opacity="0.45">
      <animate attributeName="cy" from="580" to="-40" dur="5.8s" repeatCount="indefinite" begin="1.7s"/>
      <animate attributeName="opacity" values="0;0.4;0.6;0.3;0" dur="5.8s" repeatCount="indefinite" begin="1.7s"/>
    </circle>
    <circle cx="1140" cy="580" r="1.9" fill-opacity="0.6">
      <animate attributeName="cy" from="580" to="-40" dur="8.8s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0;0.5;0.7;0.4;0" dur="8.8s" repeatCount="indefinite" begin="0.7s"/>
    </circle>

    <!-- Small snow particles for depth -->
    <circle cx="60" cy="580" r="1.0" fill-opacity="0.3">
      <animate attributeName="cy" from="580" to="-40" dur="6s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" values="0;0.3;0.4;0.2;0" dur="6s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="260" cy="580" r="0.8" fill-opacity="0.25">
      <animate attributeName="cy" from="580" to="-40" dur="5.2s" repeatCount="indefinite" begin="1.3s"/>
      <animate attributeName="opacity" values="0;0.2;0.3;0.1;0" dur="5.2s" repeatCount="indefinite" begin="1.3s"/>
    </circle>
    <circle cx="460" cy="580" r="1.2" fill-opacity="0.35">
      <animate attributeName="cy" from="580" to="-40" dur="7.2s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0;0.3;0.4;0.2;0" dur="7.2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="660" cy="580" r="0.9" fill-opacity="0.3">
      <animate attributeName="cy" from="580" to="-40" dur="4.8s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="opacity" values="0;0.2;0.3;0.1;0" dur="4.8s" repeatCount="indefinite" begin="2.5s"/>
    </circle>
    <circle cx="860" cy="580" r="1.1" fill-opacity="0.35">
      <animate attributeName="cy" from="580" to="-40" dur="6.8s" repeatCount="indefinite" begin="0.1s"/>
      <animate attributeName="opacity" values="0;0.3;0.4;0.2;0" dur="6.8s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
    <circle cx="1060" cy="580" r="0.7" fill-opacity="0.25">
      <animate attributeName="cy" from="580" to="-40" dur="4.5s" repeatCount="indefinite" begin="1.9s"/>
      <animate attributeName="opacity" values="0;0.2;0.3;0.1;0" dur="4.5s" repeatCount="indefinite" begin="1.9s"/>
    </circle>
  </g>
</svg>
