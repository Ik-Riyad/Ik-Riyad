<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="320" viewBox="0 0 1280 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Riyad banner">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#23103a"/>
      <stop offset="55%" stop-color="#0f0717"/>
      <stop offset="100%" stop-color="#3a0e14"/>
    </linearGradient>

    <!-- soft glow filter for text -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- small snow circle -->
    <g id="snow">
      <circle r="3" fill="rgba(255,255,255,0.85)"/>
    </g>
  </defs>

  <!-- Background rectangle -->
  <rect x="0" y="0" width="1280" height="320" fill="url(#bg)"/>

  <!-- center logo/text -->
  <g id="logo" transform="translate(640,150)">
    <!-- styled text (Riyad) -->
    <text x="0" y="-10"
          text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-weight="700"
          font-size="88"
          fill="#ffffff"
          filter="url(#glow)"
          letter-spacing="0.5">
      Riyad
    </text>
  </g>

  <!-- Animated "snow" particles (moving bottom -> top) -->
  <!-- We'll place multiple circles, each with its own animate for 'cy' going from 340 -> -30 -->
  <!-- The circles are placed in absolute positions (cx), but animate cy bottom->top -->
  <g id="particles" fill="#ffffff" fill-opacity="0.9">
    <!-- Particle 1 -->
    <circle cx="110" cy="340" r="2.4">
      <animate attributeName="cy" from="340" to="-30" dur="8s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="opacity" values="0;1;0.8" dur="8s" repeatCount="indefinite" begin="0s" />
    </circle>

    <!-- Particle 2 -->
    <circle cx="220" cy="340" r="3.6">
      <animate attributeName="cy" from="340" to="-30" dur="12s" repeatCount="indefinite" begin="1s" />
    </circle>

    <!-- Particle 3 -->
    <circle cx="320" cy="340" r="1.8">
      <animate attributeName="cy" from="340" to="-30" dur="6.5s" repeatCount="indefinite" begin="0.6s" />
    </circle>

    <!-- Particle 4 -->
    <circle cx="430" cy="340" r="2.8">
      <animate attributeName="cy" from="340" to="-30" dur="10s" repeatCount="indefinite" begin="2.2s" />
    </circle>

    <!-- Particle 5 -->
    <circle cx="540" cy="340" r="2.0">
      <animate attributeName="cy" from="340" to="-30" dur="7.5s" repeatCount="indefinite" begin="0.9s" />
    </circle>

    <!-- Particle 6 -->
    <circle cx="650" cy="340" r="3.2">
      <animate attributeName="cy" from="340" to="-30" dur="9.5s" repeatCount="indefinite" begin="0.4s" />
    </circle>

    <!-- Particle 7 -->
    <circle cx="760" cy="340" r="2.4">
      <animate attributeName="cy" from="340" to="-30" dur="11s" repeatCount="indefinite" begin="1.7s" />
    </circle>

    <!-- Particle 8 -->
    <circle cx="870" cy="340" r="1.6">
      <animate attributeName="cy" from="340" to="-30" dur="6s" repeatCount="indefinite" begin="0.2s" />
    </circle>

    <!-- Particle 9 -->
    <circle cx="980" cy="340" r="2.2">
      <animate attributeName="cy" from="340" to="-30" dur="8.2s" repeatCount="indefinite" begin="1.1s" />
    </circle>

    <!-- Particle 10 -->
    <circle cx="1100" cy="340" r="3.8">
      <animate attributeName="cy" from="340" to="-30" dur="13s" repeatCount="indefinite" begin="2.5s" />
    </circle>

    <!-- You can duplicate or vary more for richer effect -->
  </g>

  <!-- optional subtle vignette -->
  <radialGradient id="vign" cx="50%" cy="35%" r="80%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
  </radialGradient>
  <rect x="0" y="0" width="1280" height="320" fill="url(#vign)"/>
</svg>
